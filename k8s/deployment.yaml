
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: ghcr.io/astha-proj/nginx-github-actions-cicd:3c2b1480bb5173e71413afa845c315ceb8376b65
          ports:
            - containerPort: 80
