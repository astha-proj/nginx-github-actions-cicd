
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: ghcr.io/astha-proj/nginx-github-actions-cicd:7043e661f6c281ac840d8f37cc97cdbdb439784f
          ports:
            - containerPort: 80
