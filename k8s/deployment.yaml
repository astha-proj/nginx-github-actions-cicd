
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: ghcr.io/astha-proj/nginx-github-actions-cicd:3e14680309faa283cdf21b29356d56ea67c8a140
          ports:
            - containerPort: 80
