
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: ghcr.io/astha-proj/nginx-github-actions-cicd:0cdb72d461fc86681d5627c188683cd08ba40c6d
          ports:
            - containerPort: 80
