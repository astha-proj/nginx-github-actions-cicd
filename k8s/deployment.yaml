
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      containers:
        - name: nginx
          image: ghcr.io/astha-proj/nginx-github-actions-cicd:b97cc429a6f78cf4fd483eb7450b71e3182cb2c2
          ports:
            - containerPort: 80
